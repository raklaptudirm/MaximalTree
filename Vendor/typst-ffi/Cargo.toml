[package]
name = "typst-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI bindings to the typst compiler for MaximalTree (macOS now, iOS later)."

[lib]
name = "typst_ffi"
crate-type = ["staticlib"]

[dependencies]
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-render = "0.15"
typst-svg = "0.15"
# Fonts, plus package storage (gzip/tar extraction + the Universe registry
# layout). Deliberately *not* "system-downloader": that pulls ureq + openssl,
# and HTTP belongs on the host side, where the app's networking, proxies, and
# error reporting already live. We implement typst-kit's `Downloader` trait
# over a callback into Swift instead — see `typst_set_package_fetcher`.
typst-kit = { version = "0.15", default-features = false, features = ["scan-fonts", "embedded-fonts", "system-packages"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"

[profile.release]
strip = true
