# What builds without the Mac app: the SDK's core, the host's engine, and each
# plugin's core half — on Linux and on macOS, through Package.swift.
#
# Not the app itself. That needs Xcode's beta, XcodeGen, and libghostty built
# from source with Zig (Scripts/build-ghostty.sh); it is checked locally, by
# the suite in MaximalTree.xcodeproj.

name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Core on Linux
    runs-on: ubuntu-latest
    # The official toolchain image. Unpinned while the minimum Swift the code
    # needs is being found out; pin it once a version is known to pass.
    container: swift:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          # build-essential for `cc`: the image's Swift brings clang, but
          # Rust links its build scripts with the system's C toolchain.
          apt-get update -q && apt-get install -yq curl build-essential
          curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The typst engine is the slow part, and changes least.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            Vendor/typst-ffi/target
          key: typst-ffi-${{ runner.os }}-${{ hashFiles('Vendor/typst-ffi/Cargo.lock', 'Vendor/typst-ffi/src/**') }}
          restore-keys: typst-ffi-${{ runner.os }}-

      - name: Build the typst engine
        working-directory: Vendor/typst-ffi
        shell: bash
        run: set -o pipefail; cargo build --release 2>&1 | tee "$GITHUB_WORKSPACE/cargo.log"

      - run: swift --version
      - name: swift test
        shell: bash
        run: set -o pipefail; swift test 2>&1 | tee swift.log

      # The logs are only for people signed in to GitHub; annotations are for
      # anyone, the API included. So a failure says what failed in those.
      - name: Say what failed
        if: failure()
        shell: bash
        run: .github/report-failure.sh cargo.log swift.log

  macos:
    name: Core on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            Vendor/typst-ffi/target
          key: typst-ffi-${{ runner.os }}-${{ hashFiles('Vendor/typst-ffi/Cargo.lock', 'Vendor/typst-ffi/src/**') }}
          restore-keys: typst-ffi-${{ runner.os }}-

      # The same build the Xcode project's script phase runs.
      - name: Build the typst engine
        working-directory: Vendor/typst-ffi
        shell: bash
        run: set -o pipefail; cargo build --release 2>&1 | tee "$GITHUB_WORKSPACE/cargo.log"

      - run: swift --version
      - name: swift test
        shell: bash
        run: set -o pipefail; swift test 2>&1 | tee swift.log

      # The logs are only for people signed in to GitHub; annotations are for
      # anyone, the API included. So a failure says what failed in those.
      - name: Say what failed
        if: failure()
        shell: bash
        run: .github/report-failure.sh cargo.log swift.log
