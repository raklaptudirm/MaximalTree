name: MaximalTree
options:
  bundleIdPrefix: com.maximaltree
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Local dev: ad-hoc sign so the app + hosted tests launch without a team/identity.
# Distribution signing (hardened runtime, notarization) is layered on later.
packages:
  # The editor engine (TextKit 2). One package with AppKit AND UIKit
  # implementations behind the same import — the same product serves the
  # eventual iOS version of MaximalEditorKit.
  STTextView:
    url: https://github.com/krzyzanowskim/STTextView
    from: "2.3.11"

  # TextKit 2 conveniences (NSRange ↔ NSTextRange, segment frames) — already a
  # transitive dependency of STTextView; imported directly for math overlays.
  STTextKitPlus:
    url: https://github.com/krzyzanowskim/STTextKitPlus
    from: "0.3.0"

settings:
  base:
    SWIFT_VERSION: "6.0"            # Swift 6 language mode: complete data-race checking
    # Apple Silicon only, because the typst FFI decides it: cargo builds
    # libtypst_ffi.a for the host, and the toolchain here ships only the
    # aarch64-apple-darwin std. Release otherwise defaults to "arm64 x86_64"
    # and dies at link with "symbol(s) not found for architecture x86_64" —
    # Debug hid it by building the active arch alone. For a universal build,
    # add the x86_64-apple-darwin std to the Rust toolchain, build both
    # targets, and lipo them into one archive before this links.
    ARCHS: arm64
    # Where the typst FFI's cargo output lives. The build phase below exports
    # it as CARGO_TARGET_DIR and the linker searches it, so the two cannot
    # disagree. Override it (xcodebuild TYPST_FFI_TARGET_DIR=…) to give a build
    # its own copy — which is what the release install does, so that building
    # in the background can't race an interactive build over the same
    # artifacts and leave corrupt proc-macro dylibs behind.
    TYPST_FFI_TARGET_DIR: $(SRCROOT)/Vendor/typst-ffi/target
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # The plugin SDK, as a dynamic framework. Library evolution is ON so a plugin
  # compiled against SDK vN keeps loading against a newer host (the ABI contract
  # that makes in-process bundle plugins viable at step 2). Future .bundle plugin
  # targets link this framework "Do Not Embed"; the app embeds it once.
  MaximalTreeKit:
    type: framework
    platform: macOS
    sources: [Sources/MaximalTreeKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.kit
        GENERATE_INFOPLIST_FILE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        DEFINES_MODULE: YES

  # A plugin, as a loadable bundle. Links the shared framework but does NOT embed it
  # (embed: false) — at load time it resolves against the copy the host already
  # loaded. The rpath reaches the host app's Frameworks dir from Contents/PlugIns.
  FileSystemPlugin:
    type: bundle
    platform: macOS
    sources: [Sources/FileSystemPlugin]
    dependencies:
      - target: MaximalTreeKit
        embed: false
    settings:
      base:
        PRODUCT_NAME: FileSystem
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.plugin.filesystem
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: FileSystemPlugin
        LD_RUNPATH_SEARCH_PATHS:
          - "@loader_path/../../../../Frameworks"

  # The ONE target that touches the editor engine (STTextView). The app embeds it
  # once; editor plugins link it without embedding. No library evolution: its
  # dependencies aren't evolution-safe, so in-repo plugins simply rebuild with
  # the host (already the case).
  MaximalEditorKit:
    type: framework
    platform: macOS
    sources:
      - Sources/MaximalEditorKit
      # highlight.js (~190 grammars) runs in our own JSContext — see
      # SyntaxEngine.swift for why we don't use a wrapper library.
      - path: Vendor/highlight-js/highlight.min.js
        buildPhase: resources
    dependencies:
      # For the canvas key protocol: a canvas that handles keys in normal mode
      # says so the same way every other canvas does.
      - target: MaximalTreeKit
        embed: false
      - package: STTextView
        product: STTextView
      - package: STTextKitPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.editorkit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  TextEditorPlugin:
    type: bundle
    platform: macOS
    sources: [Sources/TextEditorPlugin]
    dependencies:
      - target: MaximalTreeKit
        embed: false
      - target: MaximalEditorKit
        embed: false
    settings:
      base:
        PRODUCT_NAME: TextEditor
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.plugin.texteditor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: TextEditorPlugin
        LD_RUNPATH_SEARCH_PATHS:
          - "@loader_path/../../../../Frameworks"

  TypstPlugin:
    type: bundle
    platform: macOS
    sources: [Sources/TypstPlugin]
    dependencies:
      - target: MaximalTreeKit
        embed: false
      - target: MaximalEditorKit
        embed: false
    preBuildScripts:
      - name: Build typst-ffi (cargo)
        # cargo caches; a no-change run is sub-second. PATH covers nix profiles,
        # rustup, and Homebrew since Xcode build phases get a minimal environment.
        script: |
          export PATH="/etc/profiles/per-user/$USER/bin:/run/current-system/sw/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          # Xcode exports its *app* toolchain settings into every script
          # phase, and cargo would apply them to host builds too — including
          # the proc-macro dylibs it compiles and then immediately loads.
          # Built that way they come out unloadable ("mis-aligned LINKEDIT
          # string pool", or E0463 for a crate cargo just built), which is why
          # this has intermittently failed under Xcode while a plain
          # `cargo build` in the same directory always worked.
          unset SDKROOT MACOSX_DEPLOYMENT_TARGET LIBRARY_PATH CPATH
          unset CFLAGS CXXFLAGS LDFLAGS OTHER_LDFLAGS
          # Build where the linker looks — one setting decides both.
          export CARGO_TARGET_DIR="$TYPST_FFI_TARGET_DIR"
          cd "$SRCROOT/Vendor/typst-ffi"
          cargo build --release
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Typst
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.plugin.typst
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: TypstPlugin
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/typst-ffi/include
        OTHER_LDFLAGS:
          - "-L$(TYPST_FFI_TARGET_DIR)/release"
          - "-ltypst_ffi"
          # libghostty's C++ and its keyboard-layout lookup (see TerminalPlugin).
          - "-lstdc++"
          - "-framework"
          - "Carbon"
        LD_RUNPATH_SEARCH_PATHS:
          - "@loader_path/../../../../Frameworks"

  GitPlugin:
    type: bundle
    platform: macOS
    sources: [Sources/GitPlugin]
    dependencies:
      - target: MaximalTreeKit
        embed: false
      # The commit message is written in the app's editor, so the motions
      # inside it are the motions everywhere else.
      - target: MaximalEditorKit
        embed: false
    settings:
      base:
        PRODUCT_NAME: Git
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.plugin.git
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: GitPlugin
        LD_RUNPATH_SEARCH_PATHS:
          - "@loader_path/../../../../Frameworks"

  TerminalPlugin:
    type: bundle
    platform: macOS
    sources:
      - Sources/TerminalPlugin
      # Ghostty's shell-integration scripts and terminfo. Without these the
      # shell never reports its title or working directory, so a terminal node
      # can't follow what its shell is doing — see GhosttyApp.
      #
      # Folder references, not groups: these are opaque data, and left to
      # Xcode's file-type guessing a fish config named `vendor_conf.d` is
      # compiled as a DTrace script.
      - path: Vendor/ghostty/resources/ghostty
        type: folder
        buildPhase: resources
      - path: Vendor/ghostty/resources/terminfo
        type: folder
        buildPhase: resources
    dependencies:
      - target: MaximalTreeKit
        embed: false
      # libghostty, built from source by Scripts/build-ghostty.sh. It is a
      # static library inside the xcframework, so it links into this bundle
      # rather than needing to be embedded and signed separately.
      - framework: Vendor/ghostty/GhosttyKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Terminal
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.plugin.terminal
        # libghostty carries C++ (glslang, among others) inside its static
        # library, so the C++ runtime has to come from here — Ghostty's own
        # Xcode project does exactly the same.
        OTHER_LDFLAGS:
          - "-lstdc++"
          # Text Input Services (keyboard layout) lives in Carbon.
          - "-framework"
          - "Carbon"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: TerminalPlugin
        LD_RUNPATH_SEARCH_PATHS:
          - "@loader_path/../../../../Frameworks"

  WebPlugin:
    type: bundle
    platform: macOS
    sources: [Sources/WebPlugin]
    dependencies:
      - target: MaximalTreeKit
        embed: false
    settings:
      base:
        PRODUCT_NAME: Web
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.plugin.web
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: WebPlugin
        LD_RUNPATH_SEARCH_PATHS:
          - "@loader_path/../../../../Frameworks"

  YouTubePlugin:
    type: bundle
    platform: macOS
    sources: [Sources/YouTubePlugin]
    dependencies:
      - target: MaximalTreeKit
        embed: false
    settings:
      base:
        PRODUCT_NAME: YouTube
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.plugin.youtube
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: YouTubePlugin
        LD_RUNPATH_SEARCH_PATHS:
          - "@loader_path/../../../../Frameworks"

  MaximalTree:
    type: application
    platform: macOS
    sources: [Sources/MaximalTree]
    dependencies:
      - target: MaximalTreeKit
      - target: MaximalEditorKit      # embedded once; editor plugins resolve to it
      - target: FileSystemPlugin      # built and copied into Contents/PlugIns
        embed: true                   # enables the copy phase...
        link: false                   # ...but don't link a loadable bundle into the app
        copy:
          destination: plugins        # ...redirected from Frameworks to PlugIns
          codeSign: true
      - target: TextEditorPlugin
        embed: true
        link: false
        copy:
          destination: plugins
          codeSign: true
      - target: GitPlugin
        embed: true
        link: false
        copy:
          destination: plugins
          codeSign: true
      - target: WebPlugin
        embed: true
        link: false
        copy:
          destination: plugins
          codeSign: true
      - target: YouTubePlugin
        embed: true
        link: false
        copy:
          destination: plugins
          codeSign: true
      - target: TerminalPlugin
        embed: true
        link: false
        copy:
          destination: plugins
          codeSign: true
      - target: TypstPlugin
        embed: true
        link: false
        copy:
          destination: plugins
          codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/MaximalTree/Info.plist
    # Written by xcodegen, so the document types live with the rest of the
    # project's description rather than in a file edited by hand.
    #
    # These have to be *static*: Launch Services reads them when the app is
    # installed, so a plugin cannot declare the types it can open the way it
    # declares its canvases and actions. Adding a format means adding it here.
    info:
      path: Sources/MaximalTree/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          # Everything the text editor renders. Ranked Alternate, not Owner:
          # this puts MaximalTree in Open With and lets you make it the default
          # per type, without it quietly taking .swift from whatever you use
          # today the moment it is installed.
          - CFBundleTypeName: Text or Source File
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.source-code
              - public.script
              - public.shell-script
              - public.json
              - public.xml
              - public.yaml
              - net.daringfireball.markdown
          # Typst is the app's own format, so it does claim this one.
          - CFBundleTypeName: Typst Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [app.typst.document]
        # macOS doesn't know what a .typ is; this teaches it, so the entry
        # above has a type to name.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.typst.document
            UTTypeDescription: Typst Document
            UTTypeConformsTo: [public.plain-text, public.source-code]
            UTTypeTagSpecification:
              public.filename-extension: [typ]

  MaximalTreeTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the plugin sources directly so provider logic stays unit-testable
    # without dlopen. The host skips loading the .bundle under XCTest to avoid a
    # duplicate principal class in-process. TypstPlugin contributes only its
    # view-free core files (engine, LSP, structure) — the canvases stay out.
    sources:
      - Tests/MaximalTreeTests
      - Sources/FileSystemPlugin
      - Sources/GitPlugin
      - Sources/TextEditorPlugin
      - path: Sources/TypstPlugin/TypstCore.swift
      - path: Sources/TypstPlugin/TypstEngine.swift
      - path: Sources/TypstPlugin/TypstLSP.swift
      - path: Sources/TypstPlugin/TypstPackages.swift
      - path: Sources/TypstPlugin/TypstProject.swift
      - path: Sources/TypstPlugin/PDFAppearance.swift
      - path: Sources/TypstPlugin/TypstServices.swift
      - path: Sources/TypstPlugin/TypstUIState.swift
      - path: Sources/TypstPlugin/TypstDocument.swift
      - path: Sources/TypstPlugin/TypstProvider.swift
      - path: Sources/TypstPlugin/ProseStyle.swift
      - Sources/WebPlugin
      - Sources/TerminalPlugin
      - path: Sources/YouTubePlugin/YouTubeCore.swift
      - path: Sources/YouTubePlugin/InnerTube.swift
      - path: Sources/YouTubePlugin/YouTubeStore.swift
      # The plugin itself too, as WebPlugin does: the host does not dlopen the
      # bundle under XCTest, so its principal class cannot collide.
      - path: Sources/YouTubePlugin/YouTube.swift
    dependencies:
      - target: MaximalTree          # hosts the tests; wires TEST_HOST/BUNDLE_LOADER
      - target: MaximalEditorKit
      - framework: Vendor/ghostty/GhosttyKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maximaltree.tests
        GENERATE_INFOPLIST_FILE: YES
        # The compile paths under test call into the typst engine directly, which
        # makes them hermetic — no typst CLI needed on the machine.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/typst-ffi/include
        OTHER_LDFLAGS:
          - "-L$(TYPST_FFI_TARGET_DIR)/release"
          - "-ltypst_ffi"
          # libghostty's C++ and its keyboard-layout lookup (see TerminalPlugin).
          - "-lstdc++"
          - "-framework"
          - "Carbon"

schemes:
  MaximalTree:
    build:
      targets:
        MaximalTree: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaximalTreeTests
